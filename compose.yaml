name: careerlens
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careerlens
      POSTGRES_USER: careerlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_local.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerlens -d careerlens"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    image: careerlens:local
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://careerlens:${POSTGRES_PASSWORD}@db:5432/careerlens
      JWT_SECRET: ${JWT_SECRET:?Run python scripts/setup_local.py first}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-2200}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      ANALYSES_PER_DAY: ${ANALYSES_PER_DAY:-5}
      GLOBAL_ANALYSES_PER_DAY: ${GLOBAL_ANALYSES_PER_DAY:-20}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
volumes:
  postgres_data:
